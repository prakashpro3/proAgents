# ProAgents Configuration
# Customize this file for your project

project:
  name: "My Project"
  type: "fullstack"  # web-frontend | fullstack | mobile | backend

# Checkpoint Configuration
# Pause for approval at these phases
checkpoints:
  after_analysis: true
  after_requirements: false
  after_design: true
  after_implementation: false
  after_testing: false
  before_deployment: true

# Entry Mode Configuration
entry_modes:
  allow_direct_implementation: true
  allow_bug_fix_fast_track: true
  allow_quick_changes: true

  # Guardrails
  require_tests_always: true
  require_review_for_critical: true
  max_files_without_planning: 3

  # Auto-upgrade triggers
  auto_upgrade_on:
    - "changes_exceed_3_files"
    - "touches_security_code"
    - "modifies_database"
    - "changes_api_contract"

# Git Configuration
git:
  enabled: true
  branch_prefix: "feature/"
  commit_convention: "conventional"  # conventional | simple | custom
  require_pr: true

  # Pre-commit checks for pa:commit
  pre_commit:
    enabled: true           # Master toggle for pre-commit checks
    lint: true              # Run linter before commit
    type_check: true        # Run type checker before commit
    test_affected: false    # Run tests for changed files

  # Safety warnings for pa:commit
  safety:
    warn_main_branch: true      # Warn if committing to main/master
    warn_sensitive_files: true  # Warn for .env, credentials, etc.
    warn_large_files: true      # Warn if file > threshold
    large_file_threshold: 1048576  # 1MB in bytes
    sensitive_patterns:
      - ".env*"
      - "credentials*"
      - "secrets*"
      - "*.pem"
      - "*.key"
      - "id_rsa*"

# Workflow Configuration
# Controls how AI handles task size and worktrees
workflow:
  # Worktree mode: auto | always-ask | always-branch | always-worktree
  # - auto: Small tasks use branch (no ask), large tasks ask user
  # - always-ask: Always ask user for workflow choice
  # - always-branch: Never use worktree, always simple branch
  # - always-worktree: Always create worktree for each task
  worktree_mode: "auto"

  # Task size indicators for auto mode
  task_indicators:
    small:
      - "fix typo"
      - "small bug"
      - "quick fix"
      - "update text"
      - "minor change"
      - "hotfix"
    large:
      - "implement"
      - "create feature"
      - "refactor"
      - "new module"
      - "authentication"
      - "payment"
      - "integration"
      - "migration"

  # Worktree naming
  worktree_naming:
    prefix: "../"  # Relative to current directory
    format: "{project}-{taskname}"  # e.g., myapp-user-auth

# Parallel Feature Development
parallel_features:
  enabled: true
  max_concurrent: 3

# Documentation Configuration
documentation:
  default_mode: "moderate"  # full | moderate | lite
  default_scope: "project"

  # Output locations for different document types
  output:
    format: "markdown"
    include_diagrams: true

    # Client-facing docs (at project root for easy sharing)
    client_facing:
      changelog: "./CHANGELOG.md"           # Project changelog
      release_notes: "./RELEASE_NOTES.md"   # Current release summary
      readme: "./README.md"                 # Project README
      releases_dir: "./docs/releases/"      # Version-specific release notes
      api_docs: "./docs/api/"               # Public API documentation

    # Internal development docs (inside .proagents/)
    internal:
      feature_docs: "./.proagents/active-features/"  # Feature-specific docs
      dev_changelog: "./.proagents/changelog/"       # Detailed dev notes
      learning: "./.proagents/.learning/"            # AI learning data

  required_for_all_modes: true

  # Auto-generate settings
  auto_generate:
    release_notes_on_deploy: true
    changelog_on_feature_complete: true
    update_readme_on_major_changes: false

# AI Model Configuration
ai:
  default_model: "auto"  # auto | claude-3-opus | gpt-4 | etc.

  task_specific:
    code_analysis: "auto"
    code_generation: "auto"
    quick_fixes: "auto"
    documentation: "auto"

  cost_management:
    daily_limit: 50.00
    alert_at: 40.00
    fallback_to_cheaper: true

# Testing Configuration
testing:
  coverage_targets:
    unit: 80
    integration: 60
    e2e: "critical_flows"
  parallel: true
  max_workers: 4

  # Custom Testing Tools (override defaults)
  # Define your own tools for each test type
  tools:
    # Unit testing
    unit:
      command: "npm test"           # or: pytest, go test, ./gradlew test
      framework: "jest"             # jest | vitest | mocha | pytest | junit | xctest | flutter_test
      # install: "npm install"      # optional: auto-install command

    # Integration testing
    integration:
      command: "npm run test:integration"
      framework: "jest"

    # E2E testing
    e2e:
      command: "npx playwright test"  # or: maestro test, detox test, ./gradlew connectedTest
      framework: "playwright"         # playwright | cypress | maestro | detox | espresso | xcuitest
      # install: "npx playwright install"

    # Visual testing
    visual:
      command: "npx percy exec -- npm test"
      framework: "percy"              # percy | chromatic | applitools | custom

    # Load testing
    load:
      command: "k6 run loadtest.js"
      framework: "k6"                 # k6 | artillery | locust | jmeter

    # Security testing
    security:
      command: "npm audit && snyk test"
      framework: "snyk"               # snyk | npm-audit | owasp-zap

  # Mobile Testing Tools (platform-specific)
  mobile:
    # React Native / Expo
    react_native:
      unit:
        command: "npm test"
        framework: "jest"
      component:
        command: "npm test -- --testPathPattern=components"
        framework: "@testing-library/react-native"
      e2e:
        command: "maestro test .maestro/"
        framework: "maestro"          # maestro | detox | appium
        # alternative: "npx detox test -c ios.sim.release"

    # Native Android (Kotlin/Java)
    android:
      unit:
        command: "./gradlew test"
        framework: "junit"            # junit | junit5 | kotest
      integration:
        command: "./gradlew connectedAndroidTest"
        framework: "espresso"
      e2e:
        command: "maestro test .maestro/"
        framework: "maestro"          # maestro | espresso | ui-automator

    # Native iOS (Swift/Objective-C)
    ios:
      unit:
        command: "xcodebuild test -scheme MyApp -destination 'platform=iOS Simulator,name=iPhone 15'"
        framework: "xctest"
      e2e:
        command: "maestro test .maestro/"
        framework: "maestro"          # maestro | xcuitest

    # Flutter
    flutter:
      unit:
        command: "flutter test"
        framework: "flutter_test"
      integration:
        command: "flutter test integration_test/"
        framework: "integration_test"
      e2e:
        command: "maestro test .maestro/"
        framework: "maestro"

  # Auto-install missing tools
  auto_install: true

  # Custom test commands (shortcuts)
  custom_commands:
    "test:quick": "npm test -- --onlyChanged"
    "test:ci": "npm test -- --coverage --ci"

# Security Configuration
security:
  require_review: true
  scan_dependencies: "daily"  # daily | weekly | on_change
  owasp_compliance: true

# Learning Configuration
learning:
  enabled: true
  track_preferences: true
  track_patterns: true
  track_corrections: true
  auto_apply_corrections: true
  auto_adjust_checkpoints: true

# =============================================================================
# AUTOMATION CONFIGURATION (NEW)
# =============================================================================
# Controls how AI makes decisions without asking questions
automation:
  # Automation level: full | semi | guided | manual
  # - full: No questions, all decisions auto-made
  # - semi: Only pause for critical decisions
  # - guided: Pause at checkpoints only
  # - manual: Ask for guidance (traditional mode)
  level: "full"

  # Allow user intervention (overrides level for specific situations)
  user_intervention: false

  # Log all auto-decisions for post-review
  log_decisions: true

  # Show decision summary after workflow completion
  show_summary: true

  # Confidence threshold for flagging decisions
  # Decisions below this confidence are flagged for review
  confidence_threshold: "medium"  # high | medium | low

  # Pre-configured decisions (prevents AI from asking)
  decisions:
    # Architecture
    architecture:
      api_style: "rest"
      state_management: "zustand"
      styling: "tailwind"
      database: "postgresql"
      orm: "prisma"
      auth_method: "jwt"

    # Code Style
    code_style:
      component_style: "functional"
      export_style: "named"
      props_style: "interface"

    # Testing
    testing:
      framework: "vitest"
      coverage_target: 80
      location: "colocated"

    # Implementation
    implementation:
      approach: "simplest"
      error_handling: "try-catch"
      null_handling: "optional-chaining"

  # Behavior when decision not in config
  fallback:
    unknown_decisions: "use_safest_default"
    flag_for_review: true

  # Safety: Even in full automation, flag these
  safety:
    always_flag:
      - "deleting_data"
      - "modifying_auth"
      - "production_deployment"
    prefer_safe_for:
      - "security_related"
      - "data_handling"

# Integration Configuration
integrations:
  jira:
    enabled: false
    # base_url: "https://company.atlassian.net"
    # project_key: "PROJ"

  linear:
    enabled: false
    # team_id: "TEAM-123"

  notion:
    enabled: false
    # database_id: "xxx-xxx"

# Approval Workflow
approvals:
  feature_approval:
    levels:
      - role: "tech_lead"
        required: true
        timeout: "24h"

  deployment_approval:
    staging:
      auto_approve: true
    production:
      required: true

# Custom Commands
custom_commands:
  "pa:ship":
    description: "Full deployment workflow"
    steps:
      - "pa:test-all"
      - "pa:qa-full"
      - "pa:deploy-prod"

  "pa:morning":
    description: "Daily start routine"
    steps:
      - "pa:status"
      - "pa:feature-list"

